# 面试练习助手 - 配置文件

# 音频配置
audio:
  source: "system"          # system / microphone
  sample_rate: 16000
  channels: 1
  chunk_size: 1024

# 语音识别配置
recognition:
  use_local: true  # true: 使用本地 Whisper, false: 使用 API
  model: "base"    # 本地模型：tiny/base/small/medium/large
  language: "zh"
  # API 配置（仅当 use_local 为 false 时使用）
  api_url: "https://token-plan-cn.xiaomimimo.com/v1/audio/transcriptions"
  api_key: "your-api-key"

# AI 答案生成配置
ai:
  base_url: "https://token-plan-cn.xiaomimimo.com/v1"
  api_key: "your-api-key"
  model: "gpt-4"
  max_tokens: 2000
  temperature: 0.7

# 界面配置
ui:
  hotkey: "ctrl+b"
  opacity: 0.9
  font_size: 14
  font_family: "Microsoft YaHei"
  position: "top-right"     # top-left / top-right / bottom-left / bottom-right
  width: 400
  max_height: 600

# 问题过滤配置
filter:
  min_question_length: 10
  max_question_length: 500
  ignore_patterns:
    - "你好"
    - "稍等"
    - "下一个"
    - "开始"
    - "结束"
    - "可以了"
    - "好的"
  question_keywords:
    - "什么"
    - "如何"
    - "为什么"
    - "请解释"
    - "请描述"
    - "请实现"
    - "请设计"
    - "请编写"
    - "请写"
    - "怎么做"
    - "原理"
    - "区别"
    - "优缺点"
